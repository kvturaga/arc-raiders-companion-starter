name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --locked
      - name: Format
        run: uv run ruff format --check src tests
      - name: Lint
        run: uv run ruff check src tests
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Data rules
        run: |
          if [ -d data ]; then uv run arc audit; else uv run arc init && uv run arc audit; fi
