name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --locked
      - name: Format
        run: uv run ruff format --check src tests
      - name: Lint
        run: uv run ruff check src tests
      - name: Types
        run: uv run mypy
      - name: Tests
        # The full suite (with the legacy import) must cover 90%; a shared copy runs its own tests.
        run: |
          if [ -d legacy ]; then floor=90; else floor=0; fi
          uv run pytest --cov=arc_companion --cov-report=term --cov-fail-under=$floor
      - name: Data rules
        run: |
          if [ -d data ]; then uv run arc audit; else uv run arc init && uv run arc audit; fi
